<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rugby Kick 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; }

    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      user-select: none;
    }

    #score-panel {
      position: absolute;
      top: 20px; left: 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 12px;
      padding: 16px 24px;
      backdrop-filter: blur(8px);
    }
    #score-panel h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; margin-bottom: 4px; }
    #score-value { font-size: 48px; font-weight: 800; line-height: 1; }
    #attempts-value { font-size: 16px; opacity: 0.8; margin-top: 4px; }

    #power-container {
      position: absolute;
      bottom: 40px; left: 50%;
      transform: translateX(-50%);
      width: 300px;
      text-align: center;
    }
    #power-label { font-size: 14px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.8; margin-bottom: 8px; }
    #power-bar-bg {
      width: 100%;
      height: 24px;
      background: rgba(0,0,0,0.5);
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.3);
    }
    #power-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00ff88, #ffcc00, #ff4444);
      border-radius: 10px;
      transition: width 0.05s linear;
    }

    #direction-indicator {
      position: absolute;
      bottom: 100px; left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      opacity: 0.9;
    }
    #direction-arrow {
      display: inline-block;
      font-size: 28px;
      transition: transform 0.1s;
    }

    #message {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: 800;
      text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      opacity: 0;
      transition: opacity 0.3s;
    }
    #message.show { opacity: 1; }
    #message.goal { color: #00ff88; }
    #message.miss { color: #ff4444; }

    #instructions {
      position: absolute;
      bottom: 160px; left: 50%;
      transform: translateX(-50%);
      text-align: center;
      font-size: 13px;
      opacity: 0.6;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="score-panel">
      <h2>Puntaje</h2>
      <div id="score-value">0</div>
      <div id="attempts-value">Intentos: 0 / 0</div>
    </div>

    <div id="power-container">
      <div id="power-label">Potencia</div>
      <div id="power-bar-bg">
        <div id="power-bar-fill"></div>
      </div>
    </div>

    <div id="direction-indicator">
      <span id="direction-arrow">&#9650;</span>
      <div id="direction-text" style="font-size:13px; margin-top:4px;">Centro</div>
    </div>

    <div id="message"></div>

    <div id="instructions">
      &#8592; &#8594; Ajustar direcci&oacute;n &nbsp;|&nbsp; ESPACIO mantener = potencia &nbsp;|&nbsp; Soltar = patear
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
