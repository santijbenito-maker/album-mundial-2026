<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Álbum 2026">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%231d4ed8'/><text x='50%25' y='58%25' font-size='110' text-anchor='middle' fill='white' font-family='system-ui'>⚽</text></svg>">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231d4ed8'/><text x='50%25' y='62%25' font-size='40' text-anchor='middle' fill='white' font-family='system-ui'>⚽</text></svg>">
<title>Álbum Mundial 2026</title>
<style>
  :root {
    --bg: #f5f6f8;
    --bg-elev: #ffffff;
    --bg-elev-2: #eef0f4;
    --text: #0f172a;
    --text-dim: #64748b;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --missing: #e5e7eb;
    --missing-text: #475569;
    --owned: #2563eb;
    --owned-text: #ffffff;
    --shield: #f59e0b;
    --shield-text: #1f2937;
    --fwc: #fbbf24;
    --fwc-strong: #d97706;
    --cc: #dc2626;
    --cc-strong: #991b1b;
    --dup: #f97316;
    --accent: #1d4ed8;
    --danger: #dc2626;
    --ok: #16a34a;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
    --user-yo: #2563eb;
    --user-facu: #16a34a;
    --user-ange: #db2777;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220;
      --bg-elev: #111a2e;
      --bg-elev-2: #18233d;
      --text: #e2e8f0;
      --text-dim: #94a3b8;
      --border: #1f2a44;
      --border-strong: #2c3a5c;
      --missing: #1f2a44;
      --missing-text: #94a3b8;
      --owned: #3b82f6;
      --shield: #f59e0b;
      --shield-text: #1f2937;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220;
    --bg-elev: #111a2e;
    --bg-elev-2: #18233d;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --border: #1f2a44;
    --border-strong: #2c3a5c;
    --missing: #1f2a44;
    --missing-text: #94a3b8;
    --owned: #3b82f6;
    --shield: #f59e0b;
    --shield-text: #1f2937;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(80px + var(--safe-bottom));
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }

  /* ===== Header / Stats ===== */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: calc(10px + var(--safe-top)) 12px 8px;
    box-shadow: var(--shadow);
  }
  .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }
  .title-row h1 {
    font-size: 18px;
    margin: 0;
    flex: 1;
    font-weight: 700;
  }
  .conn-badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--bg-elev-2);
    color: var(--text-dim);
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .conn-badge.online { color: var(--ok); }
  .conn-badge.offline { color: var(--danger); background: rgba(220,38,38,.1); }
  .conn-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim);
  }
  .conn-badge.online .conn-dot { background: var(--ok); }
  .conn-badge.offline .conn-dot { background: var(--danger); }
  .theme-toggle {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--bg-elev-2);
    color: var(--text);
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .theme-toggle:active { background: var(--border); }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .progress-text {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
  }
  .progress-bar {
    flex: 1;
    height: 8px;
    background: var(--bg-elev-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--owned), #60a5fa);
    border-radius: 999px;
    transition: width .25s ease;
  }
  .stats-mini {
    display: flex;
    gap: 12px;
    font-size: 12px;
    color: var(--text-dim);
    flex-wrap: wrap;
  }
  .stats-mini b { color: var(--text); }
  .users-line {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .users-line .uchip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-right: 8px;
  }
  .users-line .udot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  /* ===== Banner sin internet ===== */
  .offline-banner {
    background: #fef3c7;
    color: #78350f;
    padding: 8px 12px;
    font-size: 13px;
    text-align: center;
    border-bottom: 1px solid #fcd34d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .offline-banner { background: #422006; color: #fde68a; border-bottom-color: #78350f; }
  }
  :root[data-theme="dark"] .offline-banner { background: #422006; color: #fde68a; border-bottom-color: #78350f; }

  /* ===== Search & Filters ===== */
  .toolbar {
    padding: 8px 12px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .search-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border-strong);
    background: var(--bg-elev);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .filters {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-pill {
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--bg-elev);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .filter-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* ===== Container ===== */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 12px;
  }
  .group-divider {
    margin: 22px 0 10px;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
    color: white;
    text-transform: uppercase;
    padding: 10px 14px;
    background: linear-gradient(135deg, var(--accent), #6366f1);
    border-radius: 10px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .group-divider::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 18px;
    background: rgba(255,255,255,0.85);
    border-radius: 3px;
  }
  .group-divider:first-of-type {
    margin-top: 14px;
  }

  /* ===== Bloque (sección o país) ===== */
  details.block {
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  details.block[open] { padding-bottom: 12px; }
  details.block[data-kind="cc"] {
    border-color: var(--cc);
    background: linear-gradient(135deg, var(--cc), var(--cc-strong));
    color: white;
  }
  details.block[data-kind="cc"] .block-name,
  details.block[data-kind="cc"] .block-sub {
    color: white;
  }
  details.block > summary {
    list-style: none;
    cursor: pointer;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    user-select: none;
  }
  details.block > summary::-webkit-details-marker { display: none; }
  .block-flag {
    width: 32px;
    height: auto;
    border-radius: 3px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0,0,0,.05);
  }
  .block-icon {
    font-size: 22px;
    flex-shrink: 0;
    width: 32px;
    text-align: center;
  }
  .block-title {
    flex: 1;
    min-width: 0;
  }
  .block-name {
    font-size: 15px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .block-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .block-mini-bar {
    display: inline-block;
    width: 60px;
    height: 5px;
    background: var(--bg-elev-2);
    border-radius: 999px;
    overflow: hidden;
    vertical-align: middle;
  }
  .block-mini-fill {
    height: 100%;
    background: var(--owned);
    border-radius: 999px;
    transition: width .2s;
  }
  .block-progress-text { font-weight: 600; color: var(--text); }
  .block-dup {
    color: var(--dup);
    font-weight: 700;
  }
  .block-arrow {
    color: var(--text-dim);
    font-size: 14px;
    transition: transform .2s;
  }
  details.block[open] .block-arrow { transform: rotate(180deg); }

  /* ===== Grid de figuritas ===== */
  .grid {
    display: grid;
    gap: 6px;
    padding: 0 12px;
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
  }

  .sticker {
    aspect-ratio: 3/4;
    border-radius: 10px;
    background: var(--missing);
    color: var(--missing-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    font-weight: 700;
    font-size: 18px;
    border: 2px solid transparent;
    transition: transform .08s, background-color .15s, border-color .15s;
    user-select: none;
    overflow: hidden;
    padding: 4px;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  .sticker:active { transform: scale(.94); }
  .sticker.owned {
    background: var(--owned);
    color: var(--owned-text);
  }
  .sticker.shield {
    background: var(--shield);
    color: var(--shield-text);
  }
  .sticker.fwc.owned {
    background: var(--fwc);
    color: #1f2937;
  }
  .sticker.cc.owned {
    background: var(--cc);
    color: white;
  }
  .sticker .num {
    font-size: 18px;
    line-height: 1;
  }
  @media (min-width: 700px) {
    .sticker .num { font-size: 20px; }
  }
  .sticker .label {
    font-size: 9px;
    font-weight: 600;
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: .5px;
    opacity: .9;
  }
  .sticker .dup-badge {
    position: absolute;
    top: 3px;
    right: 3px;
    background: var(--dup);
    color: white;
    font-size: 10px;
    font-weight: 800;
    padding: 1px 5px;
    border-radius: 999px;
    line-height: 1.4;
  }
  .sticker .user-mark {
    position: absolute;
    bottom: 3px;
    right: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: white;
    color: #111;
    font-size: 9px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px rgba(0,0,0,.1);
  }
  .sticker.owned .user-mark { box-shadow: 0 0 0 1.5px rgba(255,255,255,.6); }

  /* ===== Modal ===== */
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal {
    background: var(--bg-elev);
    border-radius: 16px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  .modal h2 {
    margin: 0 0 8px;
    font-size: 20px;
  }
  .modal p {
    margin: 0 0 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .user-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .user-btn {
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    border: none;
    transition: transform .1s, opacity .15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .user-btn:active { transform: scale(.97); }
  .user-btn.yo { background: var(--user-yo); }
  .user-btn.facu { background: var(--user-facu); }
  .user-btn.ange { background: var(--user-ange); }
  .user-btn .initial {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,.25);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
  }

  /* ===== Footer ===== */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    padding: 8px 12px calc(8px + var(--safe-bottom));
    display: flex;
    gap: 6px;
    z-index: 30;
    box-shadow: 0 -2px 8px rgba(0,0,0,.06);
  }
  .footer-btn {
    flex: 1;
    padding: 10px 6px;
    border-radius: 10px;
    background: var(--bg-elev-2);
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .footer-btn .ico { font-size: 18px; }
  .footer-btn.danger { color: var(--danger); }
  .footer-btn.wa { color: #25d366; }
  .footer-btn:active { background: var(--border); }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: calc(90px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { opacity: 1; }

  .empty {
    text-align: center;
    color: var(--text-dim);
    padding: 40px 20px;
    font-size: 14px;
  }

  .loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 12px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Modal de selección de usuario -->
<div id="userModal" class="modal-bg" style="display:none">
  <div class="modal">
    <h2>¿Quién sos?</h2>
    <p>Esto se usa para mostrar quién marcó cada figurita.</p>
    <div class="user-buttons">
      <button class="user-btn yo" data-user="Santiago"><span class="initial">S</span> Santiago</button>
      <button class="user-btn facu" data-user="Facundo"><span class="initial">F</span> Facundo</button>
      <button class="user-btn ange" data-user="Ángela"><span class="initial">A</span> Ángela</button>
    </div>
  </div>
</div>

<!-- Header con stats -->
<header class="header">
  <div class="title-row">
    <h1>⚽ Álbum Mundial 2026</h1>
    <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">🌙</button>
    <span id="connBadge" class="conn-badge"><span class="conn-dot"></span><span id="connText">…</span></span>
  </div>
  <div class="progress-row">
    <span class="progress-text" id="progressText">0 / 994</span>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="stats-mini">
    <span>Faltan <b id="statMissing">994</b></span>
    <span>Repes <b id="statDups">0</b></span>
    <span id="statUserMine">Soy: <b>—</b></span>
  </div>
  <div class="users-line" id="usersLine"></div>
</header>

<div id="offlineBanner" class="offline-banner" style="display:none">
  Sin conexión — los cambios se sincronizarán cuando vuelvas a tener internet.
</div>

<div class="toolbar">
  <input type="text" id="search" class="search-input" placeholder="Buscar país, grupo, FWC, CC…" autocomplete="off">
  <div class="filters" id="filters">
    <button class="filter-pill active" data-filter="all">Todas</button>
    <button class="filter-pill" data-filter="missing">Faltantes</button>
    <button class="filter-pill" data-filter="owned">Tenidas</button>
    <button class="filter-pill" data-filter="dups">Con repes</button>
    <button class="filter-pill" data-filter="mine">Cargadas por mí</button>
  </div>
</div>

<main id="app">
  <div class="loading"><div class="spinner"></div>Cargando álbum…</div>
</main>

<div class="footer">
  <button class="footer-btn wa" id="btnExport"><span class="ico">💬</span><span>WhatsApp</span></button>
  <button class="footer-btn" id="btnSwitchUser"><span class="ico">👤</span><span>Cambiar usuario</span></button>
  <button class="footer-btn danger" id="btnReset"><span class="ico">🗑️</span><span>Reiniciar</span></button>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ============================================================

const supabase = (SUPABASE_URL.includes("TU-PROYECTO") || !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY === "TU-ANON-KEY")

    });

// ============================================================

// ============================================================

  // Grupo B
  { name: "Canadá",          code: "ca",    group: "B" },
  { name: "Bosnia",          code: "ba",    group: "B" },
  { name: "Catar",           code: "qa",    group: "B" },
  { name: "Suiza",           code: "ch",    group: "B" },
  // Grupo C
  { name: "Brasil",          code: "br",    group: "C" },
  { name: "Marruecos",       code: "ma",    group: "C" },
  { name: "Haití",           code: "ht",    group: "C" },
  { name: "Escocia",         code: "gb-sct",group: "C" },
  // Grupo D
  { name: "Estados Unidos",  code: "us",    group: "D" },
  { name: "Paraguay",        code: "py",    group: "D" },
  { name: "Australia",       code: "au",    group: "D" },

// ============================================================
// CONEXIÓN / OFFLINE
// ============================================================
function setConn(status) {
  const badge = document.getElementById("connBadge");
  const text = document.getElementById("connText");
  badge.classList.remove("online", "offline");
  if (status === "online") { badge.classList.add("online"); text.textContent = "En línea"; }
  else if (status === "offline") { badge.classList.add("offline"); text.textContent = "Sin conexión"; }
  else { text.textContent = "Conectando…"; }
  document.getElementById("offlineBanner").style.display = status === "offline" ? "block" : "none";
}

window.addEventListener("online", () => {
  state.online = true;
  setConn("online");
  flushQueue();
});
window.addEventListener("offline", () => {
  state.online = false;
  setConn("offline");
});

// ============================================================
// COLA OFFLINE
// ============================================================
function saveQueue() {
  localStorage.setItem("album_queue", JSON.stringify(state.pendingQueue));
}
function enqueue(op) {
  state.pendingQueue.push(op);
  saveQueue();
}
async function flushQueue() {
  if (!supabase || !state.online || state.pendingQueue.length === 0) return;
  const queue = [...state.pendingQueue];
  state.pendingQueue = [];
  saveQueue();
  for (const op of queue) {
    try { await pushUpdate(op.id, op.count, op.user); }
    catch (e) {
      state.pendingQueue.push(op);
      saveQueue();
    }
  }
}

// ============================================================
// SUPABASE: cargar y suscribir
// ============================================================
async function loadAll() {
  if (!supabase) {
    showToast("⚠️ Configurá SUPABASE_URL y SUPABASE_ANON_KEY en index.html");
    setConn("offline");
    renderApp();
    return;
  }
  try {
    const { data, error } = await supabase.from("stickers").select("*");
    if (error) throw error;
    state.stickers.clear();
    for (const row of data) {
      state.stickers.set(row.id, { count: row.count, last_updated_by: row.last_updated_by });
    }
    setConn("online");
  } catch (e) {
    console.error("Error cargando:", e);
    setConn("offline");
  }
  renderApp();
}

function subscribeRealtime() {
  if (!supabase) return;
  supabase
    .channel("stickers-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "stickers" }, payload => {
      if (payload.eventType === "DELETE") {
        if (payload.old?.id) state.stickers.delete(payload.old.id);
      } else {
        const row = payload.new;
        state.stickers.set(row.id, { count: row.count, last_updated_by: row.last_updated_by });
      }
      renderStats();
      updateStickerEl(payload.new?.id || payload.old?.id);
      updateBlockHeaderForId(payload.new?.id || payload.old?.id);
    })
    .subscribe(status => {
      if (status === "SUBSCRIBED") setConn("online");
      else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") setConn("offline");
    });
}

async function pushUpdate(id, count, user) {
  if (!supabase) return;
  const { error } = await supabase.from("stickers").upsert({
    id,
    count,
    last_updated_by: user,
    updated_at: new Date().toISOString(),
  }, { onConflict: "id" });
  if (error) throw error;
}

// ============================================================
// CAMBIO DE FIGURITA
// ============================================================
function changeSticker(id, delta) {
  if (!state.user) { showUserModal(); return; }
  const cur = getSticker(id);
  let next = cur.count + delta;
  if (next < 0) next = 0;
  if (next === cur.count) return;

  state.stickers.set(id, { count: next, last_updated_by: state.user });
  updateStickerEl(id);
  updateBlockHeaderForId(id);
  renderStats();

  if (state.online && supabase) {
    pushUpdate(id, next, state.user).catch(err => {
      console.error(err);
      enqueue({ id, count: next, user: state.user });
    });
  } else {
    enqueue({ id, count: next, user: state.user });
  }
}

function makeStickerEl(id, num, opts = {}) {
  const el = document.createElement("button");
  el.className = "sticker";
  el.dataset.id = id;
  if (opts.kind) el.classList.add(opts.kind);
  if (opts.shield) el.classList.add("shield");

  const numEl = document.createElement("span");
  numEl.className = "num";
  numEl.textContent = num;
  el.appendChild(numEl);

  if (opts.label) {
    const lbl = document.createElement("span");
    lbl.className = "label";
    lbl.textContent = opts.label;
    el.appendChild(lbl);
  }

  // Tap: +1
  el.addEventListener("click", e => {
    if (el._longPressed) { el._longPressed = false; return; }
    changeSticker(id, +1);
  });
  // Click derecho: -1
  el.addEventListener("contextmenu", e => {
    e.preventDefault();
    changeSticker(id, -1);
  });
  // Long-press en mobile
  let pressTimer = null;
  el.addEventListener("touchstart", e => {
    pressTimer = setTimeout(() => {
      el._longPressed = true;
      changeSticker(id, -1);
      if (navigator.vibrate) navigator.vibrate(30);
    }, 500);
  }, { passive: true });
  const cancel = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
  el.addEventListener("touchend", cancel);
  el.addEventListener("touchmove", cancel);
  el.addEventListener("touchcancel", cancel);

  applyStickerState(el, id);
  return el;
}

function applyStickerState(el, id) {
  const s = getSticker(id);
  el.classList.toggle("owned", s.count >= 1);
  // remover badge y user mark previos
  const oldBadge = el.querySelector(".dup-badge");
  if (oldBadge) oldBadge.remove();
  const oldMark = el.querySelector(".user-mark");
  if (oldMark) oldMark.remove();

  if (s.count >= 2) {
    const badge = document.createElement("span");
    badge.className = "dup-badge";
    badge.textContent = `+${s.count - 1}`;
    el.appendChild(badge);
  }
  if (s.count >= 1 && s.last_updated_by && USERS[s.last_updated_by]) {
    const mark = document.createElement("span");
    mark.className = "user-mark";
    mark.textContent = USERS[s.last_updated_by].initial;
    mark.style.background = USERS[s.last_updated_by].color;
    mark.style.color = "white";
    mark.title = s.last_updated_by;
    el.appendChild(mark);
  }
}

function updateStickerEl(id) {
  if (!id) return;
  const el = document.querySelector(`.sticker[data-id="${id}"]`);
  if (el) applyStickerState(el, id);
}

// ============================================================
// FILTRADO
// ============================================================
function passesFilter(id) {
  const s = getSticker(id);
  if (state.filter === "missing" && s.count > 0) return false;
  if (state.filter === "owned" && s.count < 1) return false;
  if (state.filter === "dups" && s.count < 2) return false;
  if (state.filter === "mine" && s.last_updated_by !== state.user) return false;
  return true;
}

function blockMatchesSearch(blockMeta) {
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  if (blockMeta.searchText.toLowerCase().includes(q)) return true;
  return false;
}

// ============================================================
// CONSTRUCCIÓN DEL DOM
// ============================================================
function buildBlock({ kind, title, icon, flagCode, sub, items, meta }) {
  const det = document.createElement("details");
  det.className = "block";
  det.dataset.searchText = meta.searchText;
  det.dataset.kind = kind;
  if (meta.startOpen) det.open = true;

  const summary = document.createElement("summary");

  if (flagCode) {
    const img = document.createElement("img");
    img.className = "block-flag";
    img.src = `https://flagcdn.com/w40/${flagCode}.png`;
    img.srcset = `https://flagcdn.com/w80/${flagCode}.png 2x`;
    img.alt = "";
    img.loading = "lazy";
    summary.appendChild(img);
  } else if (icon) {
    const ic = document.createElement("span");
    ic.className = "block-icon";
    ic.textContent = icon;
    summary.appendChild(ic);
  }

  const titleWrap = document.createElement("div");
  titleWrap.className = "block-title";
  const nameEl = document.createElement("div");
  nameEl.className = "block-name";
  nameEl.textContent = title;
  const subEl = document.createElement("div");
  subEl.className = "block-sub";
  subEl.dataset.role = "sub";
  titleWrap.appendChild(nameEl);
  titleWrap.appendChild(subEl);
  summary.appendChild(titleWrap);

  const arrow = document.createElement("span");
  arrow.className = "block-arrow";
  arrow.textContent = "▾";
  summary.appendChild(arrow);

  det.appendChild(summary);

  const grid = document.createElement("div");
  grid.className = "grid";
  for (const it of items) {
    grid.appendChild(makeStickerEl(it.id, it.num, it.opts));
  }
  det.appendChild(grid);

  // ids para refresco rápido
  det._ids = items.map(i => i.id);
  return det;
}

function blockHeaderInfo(ids) {
  let owned = 0, total = ids.length, dups = 0;
  for (const id of ids) {
    const s = getSticker(id);
    if (s.count >= 1) owned++;
    if (s.count >= 2) dups += (s.count - 1);
  }
  return { owned, total, dups };
}

function refreshBlockHeader(det) {
  const { owned, total, dups } = blockHeaderInfo(det._ids);
  const sub = det.querySelector('[data-role="sub"]');
  const pct = total ? (owned / total * 100) : 0;
  sub.innerHTML = `
    <span class="block-progress-text">${owned}/${total}</span>
    <span class="block-mini-bar"><span class="block-mini-fill" style="width:${pct}%"></span></span>
    ${dups > 0 ? `<span class="block-dup">+${dups} repes</span>` : ""}
  `;
}

function updateBlockHeaderForId(id) {
  if (!id) return;
  const all = document.querySelectorAll("details.block");
  for (const det of all) {
    if (det._ids && det._ids.includes(id)) refreshBlockHeader(det);
  }
}

function buildAlbum() {
  const app = document.getElementById("app");
  app.innerHTML = "";

  // Sección FWC
  const fwcItems = [];
  for (let i = 0; i < FWC_COUNT; i++) {
    const id = fwcId(i);
    const num = "FWC " + String(i).padStart(2, "0");
    fwcItems.push({ id, num, opts: { kind: "fwc" } });
  }
  app.appendChild(buildBlock({
    kind: "fwc",
    title: "FWC — Mundial",
    icon: "🏆",
    items: fwcItems,
    meta: { searchText: "FWC Mundial trofeo trophy", startOpen: false }
  }));

  // 12 grupos de selecciones
  let lastGroup = null;
  TEAMS.forEach((t, idx) => {
    if (t.group !== lastGroup) {
      const div = document.createElement("div");
      div.className = "group-divider";
      div.textContent = `Grupo ${t.group}`;
      div.dataset.group = t.group;
      app.appendChild(div);
      lastGroup = t.group;
    }
    const items = [];
    for (let i = 0; i < TEAM_STICKERS; i++) {
      const num = i + 1;
      const opts = {};
      if (i === 0) { opts.label = "Escudo"; opts.shield = true; }
      else if (i === 12) { opts.label = "Equipo"; }
      items.push({ id: teamStickerId(idx, i), num, opts });
    }
    app.appendChild(buildBlock({
      kind: "team",
      title: t.name,
      flagCode: t.code,
      items,
      meta: {
        searchText: `${t.name} grupo ${t.group} ${t.code}`,
        startOpen: false,
        group: t.group,
      }
    }));
  });

  // Sección CC
  const ccItems = [];
  for (let i = 0; i < CC_COUNT; i++) {
    const id = ccId(i);
    const num = "CC " + String(i + 1).padStart(2, "0");
    ccItems.push({ id, num, opts: { kind: "cc" } });
  }
  app.appendChild(buildBlock({
    kind: "cc",
    title: "CC — Coca-Cola",
    icon: "🥤",
    items: ccItems,
    meta: { searchText: "CC Coca-Cola coca cola", startOpen: false }
  }));

  // Inicializar headers
  document.querySelectorAll("details.block").forEach(refreshBlockHeader);
}

// ============================================================
// APLICAR FILTROS Y BÚSQUEDA SOBRE EL DOM
// ============================================================
function applyFiltersAndSearch() {
  const q = state.search.trim().toLowerCase();
  const groups = new Map(); // group letter -> any visible team?

  document.querySelectorAll("details.block").forEach(det => {
    const searchText = (det.dataset.searchText || "").toLowerCase();
    const matchesText = !q || searchText.includes(q) || ("grupo " + (det.dataset.group || "")).includes(q);
    let anyVisible = false;

    det._ids.forEach(id => {
      const sEl = det.querySelector(`.sticker[data-id="${id}"]`);
      if (!sEl) return;
      const ok = passesFilter(id);
      sEl.style.display = ok ? "" : "none";
      if (ok) anyVisible = true;
    });

    const blockVisible = matchesText && anyVisible;
    det.style.display = blockVisible ? "" : "none";

    // Si hay query, abrir el bloque para mostrar resultados
    if (q && blockVisible) det.open = true;
  });

  // Group dividers: ocultar si no hay equipos visibles del grupo
  document.querySelectorAll(".group-divider").forEach(div => {
    const g = div.dataset.group;
    if (!g) return;
    const anyTeamVisible = [...document.querySelectorAll(`details.block[data-kind="team"]`)]
      .some(d => d.style.display !== "none" && (d.dataset.searchText || "").toLowerCase().includes(`grupo ${g.toLowerCase()}`));
    div.style.display = anyTeamVisible ? "" : "none";
  });
}

function renderStats() {
  let owned = 0, dups = 0;
  const userCounts = { "Santiago": 0, "Facundo": 0, "Ángela": 0 };
  for (const [, s] of state.stickers) {
    if (s.count >= 1) {
      owned++;
      if (s.last_updated_by && userCounts[s.last_updated_by] != null) {
        userCounts[s.last_updated_by]++;
      }
    }
    if (s.count >= 2) dups += (s.count - 1);
  }
  const missing = TOTAL - owned;
  const pct = (owned / TOTAL * 100).toFixed(1);
  document.getElementById("progressText").textContent = `${owned} / ${TOTAL} (${pct}%)`;
  document.getElementById("progressFill").style.width = (owned / TOTAL * 100) + "%";
  document.getElementById("statMissing").textContent = missing;
  document.getElementById("statDups").textContent = dups;

  // Soy
  document.getElementById("statUserMine").innerHTML =
    state.user ? `Soy: <b>${state.user}</b>` : `Soy: <b>—</b>`;

  // Línea de usuarios
  document.getElementById("usersLine").innerHTML = `
    <span class="uchip"><span class="udot" style="background:var(--user-yo)"></span>Santiago: <b>${userCounts["Santiago"]}</b></span>
    <span class="uchip"><span class="udot" style="background:var(--user-facu)"></span>Facundo: <b>${userCounts["Facundo"]}</b></span>
    <span class="uchip"><span class="udot" style="background:var(--user-ange)"></span>Ángela: <b>${userCounts["Ángela"]}</b></span>
  `;
}

function renderApp() {
  buildAlbum();
  renderStats();
  applyFiltersAndSearch();
}

// ============================================================
function buildExportText() {
  const lines = [];
  const me = state.user || "Yo";
  lines.push(`¡Hola! Soy *${me}* y estoy llenando el *Álbum Panini Mundial 2026* 🇦🇷⚽`);
  lines.push("");
  lines.push("Estas son las que me *faltan* y las *repetidas* que tengo para cambiar 👇");
  lines.push("");

  // FWC
  const fwcMissing = [], fwcRepes = [];
  for (let i = 0; i < FWC_COUNT; i++) {
    const id = fwcId(i);
    const s = getSticker(id);
    const num = "FWC " + String(i).padStart(2, "0");
    if (s.count === 0) fwcMissing.push(num);
    else if (s.count >= 2) fwcRepes.push(`${num} ×${s.count - 1}`);
  }
  if (fwcMissing.length || fwcRepes.length) {
    lines.push("🏆 *FWC — Mundial*");
    if (fwcMissing.length) lines.push("  Faltan: " + fwcMissing.join(", "));
    if (fwcRepes.length)   lines.push("  Repes: " + fwcRepes.join(", "));
    lines.push("");
  }

  // Selecciones por grupo
  let lastGroup = null;
  TEAMS.forEach((t, idx) => {
    if (t.group !== lastGroup) {
      lines.push(`*— Grupo ${t.group} —*`);
      lastGroup = t.group;
    }
    const missing = [], repes = [];
    for (let i = 0; i < TEAM_STICKERS; i++) {
      const id = teamStickerId(idx, i);
      const s = getSticker(id);
      const num = (i + 1) + (i === 0 ? " (Escudo)" : i === 12 ? " (Equipo)" : "");
      if (s.count === 0) missing.push(num);
      else if (s.count >= 2) repes.push(`${i+1} ×${s.count - 1}`);
    }
    if (missing.length || repes.length) {
      lines.push(`*${t.name}*`);
      if (missing.length) lines.push("  Faltan: " + missing.join(", "));
      if (repes.length)   lines.push("  Repes: " + repes.join(", "));
    }
  });
  lines.push("");

  // CC
  const ccMissing = [], ccRepes = [];
  for (let i = 0; i < CC_COUNT; i++) {
    const id = ccId(i);
    const s = getSticker(id);
    const num = "CC " + String(i + 1).padStart(2, "0");
    if (s.count === 0) ccMissing.push(num);
    else if (s.count >= 2) ccRepes.push(`${num} ×${s.count - 1}`);
  }
  if (ccMissing.length || ccRepes.length) {
    lines.push("🥤 *CC — Coca-Cola*");
    if (ccMissing.length) lines.push("  Faltan: " + ccMissing.join(", "));
    if (ccRepes.length)   lines.push("  Repes: " + ccRepes.join(", "));
  }

  // Resumen
  let owned = 0, dups = 0, missingTotal = 0;
  for (const [, s] of state.stickers) {
    if (s.count >= 1) owned++;
    if (s.count >= 2) dups += s.count - 1;
  }
  missingTotal = TOTAL - owned;
  const pct = ((owned / TOTAL) * 100).toFixed(1);
  lines.push("");
  lines.push(`📊 *Resumen*: ${owned}/${TOTAL} (${pct}%) · faltan ${missingTotal} · ${dups} repes`);
  lines.push("");
  lines.push("¿Tenés alguna? ¡Avisame y arreglamos! 🤝");

  return lines.join("\n");
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    // Fallback
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch {}
    document.body.removeChild(ta);
    return ok;
  }
}

// EVENTOS UI
// ============================================================
document.getElementById("search").addEventListener("input", e => {
  state.search = e.target.value;
  applyFiltersAndSearch();
});

document.querySelectorAll(".filter-pill").forEach(p => {
  p.addEventListener("click", () => {
    document.querySelectorAll(".filter-pill").forEach(x => x.classList.remove("active"));
    p.classList.add("active");
    state.filter = p.dataset.filter;
    applyFiltersAndSearch();
  });
});

document.getElementById("btnExport").addEventListener("click", async () => {
  const txt = buildExportText();
  // En mobile/desktop con WhatsApp instalado abre la app pidiendo a quién mandárselo.
  const url = `https://wa.me/?text=${encodeURIComponent(txt)}`;
  // Copiamos también al portapapeles como respaldo por si el navegador
  // bloquea la apertura o el usuario quiere pegarlo en otra parte.
  await copyToClipboard(txt);
  window.open(url, "_blank");
  showToast("✓ Mensaje listo — elegí a quién enviárselo");
});

document.getElementById("btnSwitchUser").addEventListener("click", () => {
  showUserModal();
});

document.getElementById("btnReset").addEventListener("click", async () => {
  if (!supabase) { showToast("Configurá Supabase primero"); return; }
  if (!confirm("¿Borrar TODO el álbum? Esto afecta a los 3 (Yo, Facu, Ánge).")) return;
  if (!confirm("Última oportunidad. ¿Seguro?")) return;
  try {
    const { error } = await supabase.from("stickers").delete().neq("id", "");
    if (error) throw error;
    state.stickers.clear();
    renderApp();
    showToast("Álbum reiniciado");
  } catch (e) {
    console.error(e);
    showToast("Error al reiniciar: " + e.message);
  }
});

// ============================================================
// INIT
// ============================================================
function applyTheme(theme) {
  if (theme === "light" || theme === "dark") {
    document.documentElement.dataset.theme = theme;
  } else {
    delete document.documentElement.dataset.theme;
  }
  const btn = document.getElementById("themeToggle");
  if (btn) {
    const isDark = theme === "dark" ||
      (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches);
    btn.textContent = isDark ? "☀️" : "🌙";
    btn.title = isDark ? "Modo claro" : "Modo oscuro";
  }
}

function toggleTheme() {
  const current = localStorage.getItem("album_theme");
  const sysDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDarkNow = current === "dark" || (!current && sysDark);
  const next = isDarkNow ? "light" : "dark";
  localStorage.setItem("album_theme", next);
  applyTheme(next);
}

applyTheme(localStorage.getItem("album_theme"));
document.getElementById("themeToggle").addEventListener("click", toggleTheme);

async function init() {
  setConn("connecting");
  if (!state.user) showUserModal();
  await loadAll();
  subscribeRealtime();
  if (state.online && supabase) flushQueue();

  // Re-render stats periódicamente para mostrar estado offline
  setInterval(() => {
    if (navigator.onLine && state.online === false) {
      state.online = true; setConn("online"); flushQueue();
    } else if (!navigator.onLine && state.online === true) {
      state.online = false; setConn("offline");
    }
  }, 4000);
}

init();
</script>
